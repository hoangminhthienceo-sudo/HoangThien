# Cho phép .htaccess của WordPress hoạt động.
#
# Image wordpress:apache mặc định đặt AllowOverride None, khiến các rule rewrite
# trong .htaccess bị bỏ qua và địa chỉ /wp-json/ trả 404. Hosting thật hầu hết
# đã bật sẵn AllowOverride All, file này chỉ để bản local giống môi trường thật.
<Directory /var/www/html/>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
